<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin conexión · Panel</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b1220; color: #e2e8f0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 22rem; padding: 2rem 1.25rem; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%;
          background: linear-gradient(#ebd274, #8f7119); color: #0b1220; display: flex;
          align-items: center; justify-content: center; font: bold 24px Georgia, serif; }
  h1 { font: 600 1.25rem Georgia, serif; color: #faf3d9; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; color: #94a3b8; }
  button { border: 0; border-radius: .75rem; padding: .75rem 1.25rem; background: #d4af37; color: #0b1220; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="logo">E</div>
  <h1>Sin conexión</h1>
  <p>No hay internet en este momento. Los datos del panel no se guardan en el teléfono; cuando vuelva la conexión, reintentá.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
