<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#262a31"/><stop offset=".45" stop-color="#17191d"/><stop offset="1" stop-color="#0d0e11"/></linearGradient>
<linearGradient id="piso" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1e23"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
<linearGradient id="luzlat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9cbe0" stop-opacity=".16"/><stop offset=".35" stop-color="#b9cbe0" stop-opacity=".04"/><stop offset="1" stop-color="#b9cbe0" stop-opacity="0"/></linearGradient>
<linearGradient id="mono-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a505b"/><stop offset="1" stop-color="#2a2e35"/></linearGradient>
<linearGradient id="mono-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16181c"/><stop offset=".85" stop-color="#121418"/><stop offset="1" stop-color="#3a4654"/></linearGradient>
<linearGradient id="reflejo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb2c6" stop-opacity=".1"/><stop offset="1" stop-color="#9fb2c6" stop-opacity="0"/></linearGradient>

<linearGradient id="l-izq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d6470"/><stop offset=".55" stop-color="#3b414b"/><stop offset="1" stop-color="#262a31"/></linearGradient>
<linearGradient id="l-der" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d2026"/><stop offset=".8" stop-color="#15171b"/><stop offset="1" stop-color="#2b3540"/></linearGradient>
<linearGradient id="l-sup" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a828f"/><stop offset=".5" stop-color="#4d535e"/><stop offset="1" stop-color="#3a4049"/></linearGradient>
<filter id="lejos" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="sombra" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="grano" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .8  0 0 0 0 .85  0 0 0 0 .9  0 0 0 .05 0"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#base)"/>
<rect y="742" width="1600" height="258" fill="url(#piso)"/>
<line x1="0" y1="742" x2="1600" y2="742" stroke="#a9bccf" stroke-opacity=".12"/>
