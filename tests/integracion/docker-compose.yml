# Base de datos y API para las pruebas de integración (solo pruebas).
# La base se crea vacía: estructura previa a la Etapa 1, todas las
# migraciones del repositorio y datos inventados. No usa datos reales ni
# se conecta a Supabase, Meta ni Vercel.
name: legal-crm-pruebas
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pruebas
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:pruebas@db:5432/crm_pruebas
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: "20"
      PGRST_JWT_SECRET: secreto-de-pruebas-locales-con-al-menos-32-caracteres
    ports:
      - "127.0.0.1:54331:3000"
    depends_on:
      db:
        condition: service_healthy
