<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fuentes.css"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage,#ui,#fx{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}
.esc{position:absolute;inset:0;overflow:hidden}.capa{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.capa svg{display:block}
.luz{position:absolute;inset:0;pointer-events:none}
#grano{position:absolute;inset:0;width:1080px;height:1920px;opacity:var(--grano,.07);mix-blend-mode:overlay}
#vin{position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 50% 46%,transparent 55%,rgba(0,0,0,var(--vin,.42)))}
#ui{color:#fff;font-family:var(--f2)}
#hook{position:absolute;left:80px;width:860px;top:var(--hookTop,250px);text-align:center;font-family:var(--f1);font-weight:var(--hw,800);font-size:var(--hs,128px);line-height:1.02;color:var(--hookCol,#fff);text-shadow:0 8px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4)}
#hook em{font-style:var(--em,italic);color:var(--acc)}
#sub{position:absolute;left:80px;width:860px;top:var(--subTop,1250px);text-align:center;font-family:var(--fs,var(--f2));font-weight:800;font-size:var(--ss,84px);line-height:1.08;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.6);text-transform:var(--tt,none)}
#sub{-webkit-text-stroke:14px rgba(8,12,28,.9);paint-order:stroke fill}#sub .w{display:inline-block;transform-origin:50% 80%}#sub .h{color:var(--acc)}
.globo{position:absolute;max-width:640px;padding:26px 38px 30px;border-radius:44px;background:#fff;color:#16181d;font-family:var(--f2);font-weight:800;font-size:58px;line-height:1.1;box-shadow:0 18px 50px rgba(0,0,0,.35);opacity:0}
.globo i{position:absolute;bottom:-30px;width:44px;height:44px;background:#fff;clip-path:polygon(0 0,100% 0,15% 100%)}
#num{position:absolute;left:80px;width:860px;top:var(--numTop,400px);text-align:center;font-family:var(--fn,var(--f1));font-weight:800;font-size:300px;line-height:1;color:var(--acc);opacity:0;text-shadow:0 12px 60px rgba(0,0,0,.45);transform-origin:50% 60%}
#velo{position:absolute;inset:0;background:var(--velo,rgba(14,18,24,.9));opacity:0}
#cta{position:absolute;left:80px;width:860px;top:var(--ctaTop,600px);text-align:center;opacity:0}
#cta img{height:var(--logoH,150px);display:block;margin:0 auto 36px}
#cta .c1{font-family:var(--f2);font-weight:700;font-size:66px;color:var(--ctaCol,#fff)}
#cta .kw{display:inline-block;margin:18px 0 24px;padding:12px 50px 20px;border-radius:30px;background:var(--acc);color:var(--kwCol,#000);font-family:var(--f1);font-weight:800;font-size:var(--kws,140px);box-shadow:0 20px 80px rgba(0,0,0,.35)}
#cta .c2{font-family:var(--f2);font-weight:600;font-size:46px;color:var(--ctaCol,#fff);opacity:.9}
#nota{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:860px;top:1450px;text-align:center;background:rgba(8,12,28,.55);padding:6px 18px;border-radius:14px;font-family:var(--f2);font-weight:600;font-size:30px;line-height:1.35;color:rgba(255,255,255,.85);text-shadow:0 2px 10px rgba(0,0,0,.6)}
#marca{position:absolute;left:50%;transform:translateX(-50%);top:232px;padding:8px 26px 8px 16px;border-radius:40px;background:rgba(10,16,34,.5);backdrop-filter:blur(6px);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--f1);font-weight:600;font-size:40px;letter-spacing:.01em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55)}
#marca img{height:70px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
#cta .nm{font-family:var(--f1);font-weight:600;font-size:56px;color:#fff;margin:-14px 0 40px}
#lineas{position:absolute;inset:-300px;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 2.1deg,rgba(255,250,235,.7) 2.25deg 2.55deg,transparent 2.7deg 5.3deg);-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 26%,#000 62%);mask-image:radial-gradient(circle at 50% 50%,transparent 26%,#000 62%);mix-blend-mode:screen;pointer-events:none}
#onda{position:absolute;left:540px;top:1060px;width:420px;height:420px;border-radius:50%;border:10px solid rgba(255,236,190,.85);box-shadow:0 0 60px rgba(255,220,150,.6),inset 0 0 40px rgba(255,220,150,.4);opacity:0;transform:translate(-50%,-50%)}
#grade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,70,110,.16),rgba(0,0,0,0) 45%,rgba(255,150,70,.10));mix-blend-mode:soft-light}
#cta .kw{background-color:var(--acc);background-repeat:no-repeat}
#flash{position:absolute;inset:0;background:var(--flashCol,#fff3d6);opacity:0;mix-blend-mode:screen}
</style></head><body><div id="stage"></div><div id="grade"></div><div id="fx"></div><div id="ui"></div>
<script type="module">
const q = new URLSearchParams(location.search); const id = q.get('r');
const V = await (await fetch(`voz/${id}-h.json`)).json();
await document.fonts.ready; for (const f of ['800 40px Manrope', '300 40px Manrope', '700 40px "Playfair Display"', 'italic 700 40px "Playfair Display"', '900 40px Archivo', '700 40px "Plus Jakarta Sans"', '800 40px Outfit']) await document.fonts.load(f);
const mod = await import(`./historias/${id}.js`); const O = await mod.armar(V);
window.TOTAL = V.total; window.render = t => { O.render(t); return 1; }; window.render(0); window.ready = true;
</script></body></html>
